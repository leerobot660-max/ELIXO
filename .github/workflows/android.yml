name: ELIXO Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Download source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android components
        run: |
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"
          sdkmanager "ndk;27.2.12479018"
          sdkmanager "cmake;3.22.1"

      - name: Check project
        run: |
          echo "Checking ELIXO project..."
          ls -la
          echo "Gradle version:"
          chmod +x gradlew
          ./gradlew --version

      - name: Build ELIXO APK
        id: build
        shell: bash
        run: |
          set +e
          ./gradlew :TMessagesProj_App:assembleAfatDebug \
            --no-daemon \
            --stacktrace \
            --info \
            -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=1g" \
            2>&1 | tee elixo-build.log

          RESULT=${PIPESTATUS[0]}
          echo "Build exit code: $RESULT"
          exit "$RESULT"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ELIXO-Build-Log
          path: elixo-build.log
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ELIXO-APK
          path: TMessagesProj_App/build/outputs/apk/afat/debug/*.apk
          if-no-files-found: error
